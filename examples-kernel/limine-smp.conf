timeout: 0
serial: yes
verbose: yes

# SMP variant of the unified kernel example. Same ELF as limine.conf,
# different cmdline: adds `smp=on cpus=4` so kmain calls
# embclox_hal_x86::smp::bring_up_aps after probe and the 3 APs run
# the ap_entry halt-loop. The ctest lane `kernel-echo-e1000-smp`
# scans the serial log for "AP 1 alive" / "AP 2 alive" / "AP 3 alive"
# plus the "SMP CHECK:" counter dump.

/embclox Kernel Example (SMP)
    protocol: limine
    kernel_path: boot():/boot/kernel
    cmdline: net=static ip=10.0.2.15/24 gw=10.0.2.2 smp=on cpus=4
