timeout: 0
serial: yes
verbose: yes

# Local Hyper-V Gen1 config for the unified kernel example.
# Static IP on the dedicated `embclox-test` Internal vSwitch
# (host = 192.168.234.1/24). See docs/dev/HyperV-Testing.md.
#
# Built into kernel-hyperv.iso via
#   cmake --build build --target kernel-hyperv-image
# and consumed by scripts/hyperv-boot-test.ps1.

/embclox Kernel Example (Hyper-V vSwitch static IP)
    protocol: limine
    kernel_path: boot():/boot/kernel
    cmdline: net=static ip=192.168.234.50/24 gw=192.168.234.1
