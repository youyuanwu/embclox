timeout: 0
serial: yes
verbose: yes

# Local Hyper-V Gen1 config that forces the tulip path even when
# VMBus is available. NetVSC would otherwise always win
# (priority 10 < tulip priority 30); `nic=tulip` makes the kernel
# skip default-driver registration and register tulip alone.
#
# Requires the VM to have a Legacy Network Adapter attached
# (DEC 21140 emulation) — pass `-AddLegacyNic` to
# scripts/hyperv-boot-test.ps1.
#
# Static IP is the same `embclox-test` vSwitch as limine-hyperv.conf
# so the host-side TCP probe doesn't need to change.

/embclox Kernel Example (Hyper-V vSwitch, tulip-only)
    protocol: limine
    kernel_path: boot():/boot/kernel
    cmdline: net=static ip=192.168.234.50/24 gw=192.168.234.1 nic=tulip
