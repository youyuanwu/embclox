timeout: 0
serial: yes
verbose: yes

# Unified kernel example. Uses embclox-driver's registry to pick
# whichever NIC is present at boot. QEMU SLIRP test path uses the
# baked-in static 10.0.2.15/24; Hyper-V/Azure paths can override via
# the `net=` cmdline parameter (parsed by embclox_hal_x86::cmdline).
#
# Default cmdline: net=static ip=10.0.2.15/24 gw=10.0.2.2 (QEMU SLIRP).
# Tokens are whitespace-separated — see embclox_hal_x86::cmdline.

/embclox Kernel Example
    protocol: limine
    kernel_path: boot():/boot/kernel
    cmdline: net=static ip=10.0.2.15/24 gw=10.0.2.2
