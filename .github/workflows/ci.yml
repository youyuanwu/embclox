name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: Build, Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: x86_64-unknown-none
          components: clippy, rustfmt, llvm-tools-preview, rust-src
          cache: true
          # Preserve the per-target linker flags in .cargo/config.toml.
          rustflags: ""

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy workspace
        run: cargo clippy -- -D warnings

      - name: Clippy unit tests
        working-directory: qemu-tests/unit
        run: cargo clippy -- -D warnings

      - name: Clippy kernel example
        working-directory: examples-kernel
        run: cargo clippy -- -D warnings

      - name: Install QEMU and OVMF
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 ovmf netcat-openbsd xorriso mtools dosfstools qemu-utils

      - name: Configure CMake
        run: cmake -B build

      - name: Build images
        run: cmake --build build --target images

      - name: Run QEMU tests
        run: ctest --test-dir build --output-on-failure
